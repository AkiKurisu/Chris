<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Shared dependency ownership and location planning</title>
  <desc id="desc">Two remote scopes share a texture that becomes one remote shared bundle. A local and a remote scope share a shader that becomes one local shared bundle, preventing duplicate content.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#F8FAFC"/>
  <text x="64" y="72" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700">Shared dependencies are emitted once</text>
  <text x="64" y="105" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="16">Usage across scopes decides ownership; Local usage wins the delivery location.</text>

  <text x="64" y="155" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SOURCE SCOPES</text>
  <rect x="64" y="181" width="226" height="112" rx="17" fill="#FFFFFF" stroke="#93C5FD" filter="url(#shadow)"/>
  <rect x="82" y="199" width="68" height="24" rx="12" fill="#DBEAFE"/>
  <text x="116" y="216" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">REMOTE</text>
  <text x="82" y="257" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Scope A</text>
  <text x="82" y="280" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="13">Character pack</text>

  <rect x="64" y="317" width="226" height="112" rx="17" fill="#FFFFFF" stroke="#93C5FD" filter="url(#shadow)"/>
  <rect x="82" y="335" width="68" height="24" rx="12" fill="#DBEAFE"/>
  <text x="116" y="352" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">REMOTE</text>
  <text x="82" y="393" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Scope B</text>
  <text x="82" y="416" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="13">Costume pack</text>

  <rect x="64" y="453" width="226" height="112" rx="17" fill="#FFFFFF" stroke="#FBBF24" filter="url(#shadow)"/>
  <rect x="82" y="471" width="55" height="24" rx="12" fill="#FEF3C7"/>
  <text x="110" y="488" text-anchor="middle" fill="#B45309" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">LOCAL</text>
  <text x="82" y="529" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Core scope</text>
  <text x="82" y="552" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="13">Player baseline</text>

  <text x="430" y="155" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">DISCOVERED DEPENDENCIES</text>
  <rect x="421" y="227" width="257" height="112" rx="18" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="456" cy="262" r="16" fill="#8B5CF6"/>
  <path d="M449 262 h14 M456 255 v14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="486" y="265" fill="#4C1D95" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Shared texture</text>
  <text x="447" y="307" fill="#6D28D9" font-family="Inter, Segoe UI, sans-serif" font-size="13">Used by A + B</text>
  <rect x="573" y="290" width="81" height="24" rx="12" fill="#EDE9FE"/>
  <text x="614" y="307" text-anchor="middle" fill="#6D28D9" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">REMOTE</text>

  <rect x="421" y="407" width="257" height="112" rx="18" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="456" cy="442" r="16" fill="#F59E0B"/>
  <path d="M448 442 h16 M456 434 v16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="486" y="445" fill="#78350F" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Shared shader</text>
  <text x="447" y="487" fill="#B45309" font-family="Inter, Segoe UI, sans-serif" font-size="13">Used by A + Core</text>
  <rect x="586" y="470" width="68" height="24" rx="12" fill="#FEF3C7"/>
  <text x="620" y="487" text-anchor="middle" fill="#B45309" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">LOCAL</text>

  <path d="M290 237 C350 237 361 261 413 269" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M290 373 C351 373 361 315 413 296" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M290 260 C350 300 358 420 413 441" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M290 509 C350 509 361 473 413 461" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <text x="800" y="155" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">PLANNED BUNDLES</text>
  <path d="M678 283 H749" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M678 463 H749" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="758" y="181" width="378" height="158" rx="19" fill="#FFFFFF" stroke="#C4B5FD" filter="url(#shadow)"/>
  <rect x="784" y="205" width="86" height="28" rx="14" fill="#EDE9FE"/>
  <text x="827" y="224" text-anchor="middle" fill="#6D28D9" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">SHARED</text>
  <text x="784" y="272" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Remote texture bundle</text>
  <text x="784" y="304" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="14">Scope A and B reference the same file.</text>

  <rect x="758" y="407" width="378" height="158" rx="19" fill="#FFFFFF" stroke="#FCD34D" filter="url(#shadow)"/>
  <rect x="784" y="431" width="86" height="28" rx="14" fill="#FEF3C7"/>
  <text x="827" y="450" text-anchor="middle" fill="#B45309" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">SHARED</text>
  <text x="784" y="498" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Local shader bundle</text>
  <text x="784" y="530" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="14">Local wins; Remote content depends on it.</text>

  <rect x="64" y="620" width="1072" height="55" rx="16" fill="#0F172A"/>
  <circle cx="92" cy="648" r="8" fill="#22C55E"/>
  <text x="113" y="653" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">Result</text>
  <text x="174" y="653" fill="#CBD5E1" font-family="Inter, Segoe UI, sans-serif" font-size="14">one owner per dependency, stable bundle identity, no repeated texture or shader payload.</text>
</svg>
