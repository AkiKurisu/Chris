<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Chris Content Pipeline architecture</title>
  <desc id="desc">A project source model is converted into one content build graph. The graph feeds either a transient Addressables and SBP build or an Editor AssetDatabase mount. Runtime packages are loaded through ResourceSystem.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#F8FAFC"/>
  <text x="64" y="72" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700">One graph, two Editor paths</text>
  <text x="64" y="105" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="16">Project policy stays outside Chris; graph semantics and build safety stay inside.</text>

  <rect x="55" y="145" width="254" height="430" rx="20" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
  <rect x="55" y="145" width="254" height="54" rx="20" fill="#E0E7FF"/>
  <path d="M55 179 V199 H309 V179" fill="#E0E7FF"/>
  <text x="83" y="180" fill="#3730A3" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">PROJECT ADAPTER</text>
  <text x="83" y="241" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Source model</text>
  <text x="83" y="276" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="15">DLC definitions</text>
  <text x="83" y="306" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="15">Collections &amp; packs</text>
  <text x="83" y="336" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="15">Generated metadata</text>
  <line x1="83" y1="367" x2="281" y2="367" stroke="#E2E8F0"/>
  <text x="83" y="408" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">Owns policy</text>
  <text x="83" y="440" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="14">Discovery &amp; selection</text>
  <text x="83" y="468" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="14">Build UI / CLI</text>
  <text x="83" y="496" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="14">Player &amp; CDN delivery</text>
  <rect x="83" y="524" width="198" height="28" rx="14" fill="#EEF2FF"/>
  <text x="182" y="543" text-anchor="middle" fill="#4F46E5" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">IContentBuildGraphContributor</text>

  <path d="M309 360 H365" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="371" y="145" width="322" height="430" rx="20" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)"/>
  <rect x="371" y="145" width="322" height="54" rx="20" fill="#DBEAFE"/>
  <path d="M371 179 V199 H693 V179" fill="#DBEAFE"/>
  <text x="400" y="180" fill="#1D4ED8" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">CHRIS.CONTENTPIPELINE</text>
  <text x="400" y="241" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="700">Content Build Graph</text>

  <rect x="400" y="270" width="120" height="48" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="460" y="299" text-anchor="middle" fill="#1E3A8A" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">Scopes</text>
  <rect x="544" y="270" width="120" height="48" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="604" y="299" text-anchor="middle" fill="#1E3A8A" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">Assets</text>
  <rect x="400" y="336" width="120" height="48" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="460" y="365" text-anchor="middle" fill="#1E3A8A" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">Dependencies</text>
  <rect x="544" y="336" width="120" height="48" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="604" y="365" text-anchor="middle" fill="#1E3A8A" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">Diagnostics</text>

  <line x1="400" y1="416" x2="664" y2="416" stroke="#E2E8F0"/>
  <circle cx="414" cy="451" r="5" fill="#2563EB"/>
  <text x="430" y="456" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="14">Stable identity &amp; fingerprint</text>
  <circle cx="414" cy="485" r="5" fill="#2563EB"/>
  <text x="430" y="490" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="14">Ownership &amp; partition planning</text>
  <circle cx="414" cy="519" r="5" fill="#2563EB"/>
  <text x="430" y="524" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="14">Deterministic report</text>

  <path d="M693 285 H741" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M693 475 H741" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="748" y="145" width="397" height="245" rx="20" fill="#FFFFFF" stroke="#93C5FD" filter="url(#shadow)"/>
  <rect x="774" y="169" width="118" height="28" rx="14" fill="#DBEAFE"/>
  <text x="833" y="188" text-anchor="middle" fill="#1D4ED8" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">BUILD &amp; RELEASE</text>
  <text x="774" y="235" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">Transient Addressables</text>
  <path d="M980 230 H1015" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="1030" y="235" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">SBP</text>
  <line x1="774" y1="262" x2="1119" y2="262" stroke="#E2E8F0"/>
  <text x="774" y="298" fill="#475569" font-family="Inter, Segoe UI, sans-serif" font-size="14">Baseline / scoped Update artifacts</text>
  <path d="M946 313 V332" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="774" y="341" width="345" height="33" rx="10" fill="#EFF6FF"/>
  <text x="946" y="363" text-anchor="middle" fill="#1E40AF" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">Dynamic package · catalog + bundles</text>

  <rect x="748" y="415" width="397" height="160" rx="20" fill="#FFFFFF" stroke="#6EE7B7" filter="url(#shadow)"/>
  <rect x="774" y="439" width="112" height="28" rx="14" fill="#D1FAE5"/>
  <text x="830" y="458" text-anchor="middle" fill="#047857" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700">FAST PLAY MODE</text>
  <text x="774" y="505" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700">AssetDatabase locator</text>
  <path d="M972 500 H1010" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1020" y="505" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">Addressables API</text>
  <text x="774" y="540" fill="#64748B" font-family="Inter, Segoe UI, sans-serif" font-size="13">No persistent groups · no Bundle build</text>

  <rect x="55" y="621" width="1090" height="54" rx="16" fill="#0F172A"/>
  <text x="83" y="654" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">Runtime</text>
  <text x="158" y="654" fill="#CBD5E1" font-family="Inter, Segoe UI, sans-serif" font-size="14">ResourceSystem mounts the packaged catalog; Addressables resolves the same addresses used in Editor.</text>
  <circle cx="1113" cy="648" r="10" fill="#22C55E"/>
</svg>
